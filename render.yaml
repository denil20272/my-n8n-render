services:
  - type: web
    name: n8n-service
    env: docker
    image:
      url: docker.io/n8nio/n8n:latest
    plan: free
    region: singapore
    envVars:
      - key: N8N_PORT
        value: "5678"
      - key: WEBHOOK_URL
        generateValue: true
      - key: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
        value: "true"
